name: CapAge Sonnet longitudinal v2 cell 003

on:
  push:
    branches:
      - agent/longitudinal-cell-003-launch
    paths:
      - experiments/sandbox/LONGITUDINAL_CELL_003_AUTHORIZATION.md

permissions:
  actions: read
  contents: read

concurrency:
  group: capage-sonnet-longitudinal-v2-cell-003-once
  cancel-in-progress: false

jobs:
  cell:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce one-shot continuation boundary
        env:
          EXPECTED_EVENT: push
          EXPECTED_REF: agent/longitudinal-cell-003-launch
          EXPECTED_AUTHORIZATION: CAPAGE_LONGITUDINAL_V2_CELL_003_MAX_75_CENTS
        run: |
          set -eu
          test "$GITHUB_EVENT_NAME" = "$EXPECTED_EVENT"
          test "$GITHUB_REF_NAME" = "$EXPECTED_REF"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test -n "$ANTHROPIC_API_KEY"
          grep -Fxq "$EXPECTED_AUTHORIZATION" \
            experiments/sandbox/LONGITUDINAL_CELL_003_AUTHORIZATION.md

      - name: Verify frozen implementation and manifest
        run: |
          set -eu
          test "$(sha256sum experiments/sandbox/longitudinal_manifest_v2.json | cut -d ' ' -f1)" = "fae74f540031038ded465242af1cbe421263646ba8b4495ad1c5c5510896ee05"
          test "$(sha256sum capage/sandbox.py | cut -d ' ' -f1)" = "35b4eec2eb80a9184ca5511fdfd72c51a0d26194b7c1b211abe3ffd8e5b0a5d3"
          test "$(sha256sum capage/sandbox_runner.py | cut -d ' ' -f1)" = "9712f321b898b66a7e129d78fc8218eed8639344b3a5d0486b0e9c70778f98cb"
          test "$(sha256sum capage/memory.py | cut -d ' ' -f1)" = "6a1348a6230b7431d12853ada5ba66f2cea9bad93ff1ba2d4e0e77986c22fcee"
          test "$(sha256sum capage/longitudinal.py | cut -d ' ' -f1)" = "7a8e0cb895807869afe10ac1d9f7e9d6b503b15750d546d0434601e97fb965ab"
          python -c 'import sys; assert sys.version_info[:2] == (3, 12)'

      - name: Run unpaid quality and launch validation
        run: |
          set -eu
          python -m unittest discover -s tests -v
          python -m py_compile capage/*.py tests/*.py
          python -m capage.longitudinal \
            experiments/sandbox/longitudinal_manifest_v2.json \
            --checkpoint /tmp/capage-validation-checkpoint.json \
            --artifact-dir /tmp/capage-validation-months \
            --memory /tmp/capage-validation-memory.sqlite3 \
            --validate-only

      - name: Restore verified cell 002 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: sonnet-longitudinal-v2-cell-002-restricted
          path: artifacts/longitudinal-v2
          github-token: ${{ github.token }}
          repository: Numbscholar/CapAge
          run-id: 32118832464

      - name: Verify restored evidence and resume state
        run: |
          set -eu
          test "$(sha256sum artifacts/longitudinal-v2/checkpoint.json | cut -d ' ' -f1)" = "ab2704941dd4625550cfd5d1a432a221fee8a94f925743d5c0a12b7904ccc3cb"
          test "$(sha256sum artifacts/longitudinal-v2/memory.sqlite3 | cut -d ' ' -f1)" = "0aa0ded0d3b045cab4d962cc32bace180bd8deadb00819c05f0d9beb12b731ce"
          test "$(sha256sum artifacts/longitudinal-v2/months/sonnet-matched-memory-001-control-month-001.json | cut -d ' ' -f1)" = "f3bad67546a4926518cfd9afbfab67930edb83d740b66cd050be725389fd489a"
          test "$(sha256sum artifacts/longitudinal-v2/months/sonnet-matched-memory-001-memory-month-001.json | cut -d ' ' -f1)" = "d37ef58c8056f390f0d9a2ad62b9a7705db720b7cbd51e4668d87fc1d2d057bb"
          python - <<'PY'
          import json
          from pathlib import Path

          checkpoint = json.loads(
              Path("artifacts/longitudinal-v2/checkpoint.json").read_text()
          )
          assert checkpoint["schema_version"] == "capage-longitudinal-checkpoint-v3"
          assert checkpoint["status"] == "paused"
          assert checkpoint["stop_reason"] == "operator_checkpoint"
          assert set(checkpoint["completed_cells"]) == {
              "month-001:control",
              "month-001:memory",
          }
          assert checkpoint["errors"] == []
          PY

      - name: Record continuation provenance
        run: |
          set -eu
          git rev-parse HEAD > artifacts/longitudinal-v2/resume-commit-cell-003.txt
          printf '%s\n' '32115679232' > artifacts/longitudinal-v2/resume-source-run-cell-002.txt

      - name: Execute exactly one bounded paid cell
        run: |
          set -eu
          python -m capage.longitudinal \
            experiments/sandbox/longitudinal_manifest_v2.json \
            --checkpoint artifacts/longitudinal-v2/checkpoint.json \
            --artifact-dir artifacts/longitudinal-v2/months \
            --memory artifacts/longitudinal-v2/memory.sqlite3 \
            --max-cells 1 \
            --confirm RUN_MATCHED_LONGITUDINAL_V2

      - name: Upload restricted evidence and resume state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonnet-longitudinal-v2-cell-003-restricted
          path: artifacts/longitudinal-v2/
          if-no-files-found: warn
          retention-days: 30

