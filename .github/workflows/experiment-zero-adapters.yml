name: Experiment 0 adapter checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/experiment-zero-adapters.yml"
      - "experiments/experiment_zero/adapters/**"
      - "experiments/experiment_zero/probe_models.py"
      - "experiments/experiment_zero/test_*.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/experiment-zero-adapters.yml"
      - "experiments/experiment_zero/**"

permissions:
  contents: read

jobs:
  check-adapters:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm repository secrets are available
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$ANTHROPIC_API_KEY"
      - name: Confirm candidate models are available
        run: python experiments/experiment_zero/probe_models.py
      - name: Validate adapter syntax and runner tests
        run: |
          python -m py_compile experiments/experiment_zero/adapters/*.py
          python -m unittest discover -s experiments/experiment_zero -p "test_*.py"
