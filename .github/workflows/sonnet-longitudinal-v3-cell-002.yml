name: CapAge Sonnet longitudinal v3 cell 002

on:
  push:
    branches:
      - agent/longitudinal-v3-cell-002-launch
    paths:
      - experiments/sandbox/LONGITUDINAL_V3_CELL_002_AUTHORIZATION.md

permissions:
  actions: read
  contents: read

concurrency:
  group: capage-sonnet-longitudinal-v3-cell-002-once
  cancel-in-progress: false

jobs:
  cell:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce one-shot continuation boundary
        env:
          EXPECTED_EVENT: push
          EXPECTED_REF: agent/longitudinal-v3-cell-002-launch
          EXPECTED_AUTHORIZATION: CAPAGE_LONGITUDINAL_V3_CELL_002_MAX_75_CENTS
        run: |
          set -eu
          test "$GITHUB_EVENT_NAME" = "$EXPECTED_EVENT"
          test "$GITHUB_REF_NAME" = "$EXPECTED_REF"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test -n "$ANTHROPIC_API_KEY"
          grep -Fxq "$EXPECTED_AUTHORIZATION" \
            experiments/sandbox/LONGITUDINAL_V3_CELL_002_AUTHORIZATION.md

      - name: Verify frozen implementation and manifest
        run: |
          set -eu
          test "$(sha256sum experiments/sandbox/longitudinal_manifest_v3.json | cut -d ' ' -f1)" = "66bd51f8ddab222b6e36148f2ac88c0896744c087946eefd66b52b45320e34ce"
          test "$(sha256sum capage/sandbox.py | cut -d ' ' -f1)" = "35b4eec2eb80a9184ca5511fdfd72c51a0d26194b7c1b211abe3ffd8e5b0a5d3"
          test "$(sha256sum capage/sandbox_runner.py | cut -d ' ' -f1)" = "9712f321b898b66a7e129d78fc8218eed8639344b3a5d0486b0e9c70778f98cb"
          test "$(sha256sum capage/memory.py | cut -d ' ' -f1)" = "6a1348a6230b7431d12853ada5ba66f2cea9bad93ff1ba2d4e0e77986c22fcee"
          test "$(sha256sum capage/longitudinal.py | cut -d ' ' -f1)" = "7a8e0cb895807869afe10ac1d9f7e9d6b503b15750d546d0434601e97fb965ab"
          test "$(sha256sum capage/longitudinal_v3.py | cut -d ' ' -f1)" = "670bd56b2df67a24e618e358837af9838503bff57f94cba9b205d29a58034b2d"
          python -c 'import sys; assert sys.version_info[:2] == (3, 12)'

      - name: Run unpaid quality and launch validation
        run: |
          set -eu
          python -m unittest discover -s tests -v
          python -m py_compile capage/*.py tests/*.py
          python -m capage.longitudinal_v3 \
            experiments/sandbox/longitudinal_manifest_v3.json \
            --checkpoint /tmp/capage-v3-validation-checkpoint.json \
            --artifact-dir /tmp/capage-v3-validation-months \
            --memory /tmp/capage-v3-validation-memory.sqlite3 \
            --validate-only

      - name: Restore verified cell 001 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: sonnet-longitudinal-v3-cell-001-restricted
          path: artifacts/longitudinal-v3
          github-token: ${{ github.token }}
          repository: Numbscholar/CapAge
          run-id: 32173157019

      - name: Verify restored evidence and resume state
        run: |
          set -eu
          test "$(sha256sum artifacts/longitudinal-v3/checkpoint.json | cut -d ' ' -f1)" = "6de3db6624fa687a0c5bec926c8ad1e6cdaaa1e39dd09bc163e9a172ace3ff1d"
          test "$(sha256sum artifacts/longitudinal-v3/memory.sqlite3 | cut -d ' ' -f1)" = "f93c864e945e155d61c3c5f7652ea52a872b08c3c1c9110772a68392ed2b735b"
          test "$(sha256sum artifacts/longitudinal-v3/months/sonnet-matched-memory-v3-001-control-month-001-attempt.json | cut -d ' ' -f1)" = "ec82a82ed4507b2a46b8cfa93ab2158c0d119d347807a033bb46fefc99079c53"
          test "$(sha256sum artifacts/longitudinal-v3/months/sonnet-matched-memory-v3-001-control-month-001-audit.jsonl | cut -d ' ' -f1)" = "2e349c2e6fcfdaddd7e8345f57853c7b7db33cb699e9d711f751bbbf8ed2708e"
          test "$(sha256sum artifacts/longitudinal-v3/months/sonnet-matched-memory-v3-001-control-month-001.json | cut -d ' ' -f1)" = "629276b110a7ae2ed2945eca5a875f9c0e9bdb5dd74e988c82edc9a73643e70e"
          python - <<'PY'
          import json
          from pathlib import Path

          checkpoint = json.loads(
              Path("artifacts/longitudinal-v3/checkpoint.json").read_text()
          )
          assert checkpoint["schema_version"] == "capage-longitudinal-checkpoint-v4"
          assert checkpoint["config_commitment"] == "b09b59bf7f7b39c83d96c55eae80b8322c0735baeda9fa21d26fc1d793cc5e47"
          assert checkpoint["memory_projection_version"] == "outcome-complete-v3"
          assert checkpoint["status"] == "paused"
          assert checkpoint["stop_reason"] == "operator_checkpoint"
          assert set(checkpoint["completed_cells"]) == {"month-001:control"}
          assert checkpoint["errors"] == []
          PY

      - name: Record continuation provenance
        run: |
          set -eu
          git rev-parse HEAD > artifacts/longitudinal-v3/resume-commit-cell-002.txt
          printf '%s\n' '32173157019' > artifacts/longitudinal-v3/resume-source-run-cell-001.txt

      - name: Execute exactly one bounded paid cell
        run: |
          set -eu
          python -m capage.longitudinal_v3 \
            experiments/sandbox/longitudinal_manifest_v3.json \
            --checkpoint artifacts/longitudinal-v3/checkpoint.json \
            --artifact-dir artifacts/longitudinal-v3/months \
            --memory artifacts/longitudinal-v3/memory.sqlite3 \
            --max-cells 1 \
            --confirm RUN_MATCHED_LONGITUDINAL_V3

      - name: Upload restricted evidence and resume state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonnet-longitudinal-v3-cell-002-restricted
          path: artifacts/longitudinal-v3/
          if-no-files-found: warn
          retention-days: 30
