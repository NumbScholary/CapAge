name: CapAge Economic Homeostasis V2 three-arm launch

on:
  push:
    branches:
      - agent/homeostasis-v2-three-arm-launch
    paths:
      - experiments/sandbox/HOMEOSTASIS_V2_LAUNCH.md

permissions:
  contents: read

concurrency:
  group: capage-homeostasis-v2-three-arm-launch-once
  cancel-in-progress: false

jobs:
  experiment:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EXPECTED_CONFIRMATION: RUN_MATCHED_HOMEOSTASIS_V2_THREE_ARM_MAX_1350_CENTS
      ARTIFACT_ROOT: artifacts/homeostasis-v2-three-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce one-shot paid boundary
        run: |
          set -eu
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_NAME" = "agent/homeostasis-v2-three-arm-launch"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test -n "$ANTHROPIC_API_KEY"
          grep -Fxq "$EXPECTED_CONFIRMATION" experiments/sandbox/HOMEOSTASIS_V2_EXECUTION_GATE.md
          grep -Fxq "$EXPECTED_CONFIRMATION" experiments/sandbox/HOMEOSTASIS_V2_LAUNCH.md

      - name: Run unpaid verification
        run: |
          set -eu
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m py_compile capage/*.py tests/*.py
          python -m capage.homeostasis_v2_active_runner experiments/sandbox/economic_homeostasis_v2_prereg_v1.json --checkpoint /tmp/homeostasis-v2-validation-checkpoint.json --artifact-dir /tmp/homeostasis-v2-validation-cells --validate-only

      - name: Record execution provenance
        run: |
          set -eu
          mkdir -p "$ARTIFACT_ROOT/cells"
          git rev-parse HEAD > "$ARTIFACT_ROOT/execution-commit.txt"
          sha256sum experiments/sandbox/economic_homeostasis_v2_prereg_v1.json experiments/sandbox/HOMEOSTASIS_V2_EXECUTION_GATE.md experiments/sandbox/HOMEOSTASIS_V2_LAUNCH.md .github/workflows/homeostasis-v2-three-arm-launch.yml capage/sandbox.py capage/sandbox_runner.py capage/homeostasis.py capage/homeostasis_shadow.py capage/homeostasis_experiment.py capage/homeostasis_v2.py capage/homeostasis_v2_runner.py capage/homeostasis_v2_experiment.py capage/homeostasis_v2_active_runner.py > "$ARTIFACT_ROOT/execution-sha256.txt"

      - name: Execute all eighteen bounded matched cells
        run: |
          set -eu
          python -m capage.homeostasis_v2_active_runner experiments/sandbox/economic_homeostasis_v2_prereg_v1.json --checkpoint "$ARTIFACT_ROOT/checkpoint.json" --artifact-dir "$ARTIFACT_ROOT/cells" --max-cells 18 --confirm "$EXPECTED_CONFIRMATION"

      - name: Upload restricted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homeostasis-v2-three-arm-launch-restricted
          path: artifacts/homeostasis-v2-three-arm/
          if-no-files-found: warn
          retention-days: 30
