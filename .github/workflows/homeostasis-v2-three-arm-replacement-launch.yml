name: CapAge Economic Homeostasis V2 replacement launch

on:
  push:
    branches:
      - agent/homeostasis-v2-three-arm-replacement-launch
    paths:
      - experiments/sandbox/HOMEOSTASIS_V2_REPLACEMENT_AUTHORIZATION.md

permissions:
  contents: read

concurrency:
  group: capage-homeostasis-v2-three-arm-replacement-launch-once
  cancel-in-progress: false

jobs:
  experiment:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EXPECTED_CONFIRMATION: RUN_REPLACEMENT_HOMEOSTASIS_V2_THREE_ARM_REMAINING_MAX_1321084400_COST_UNITS
      ORIGINAL_CONFIRMATION: RUN_MATCHED_HOMEOSTASIS_V2_THREE_ARM_MAX_1350_CENTS
      AUTHORIZATION_FILE: experiments/sandbox/HOMEOSTASIS_V2_REPLACEMENT_AUTHORIZATION.md
      EXPECTED_REPAIR_MERGE: f064c4bae70d7171d685260cd91c7744765fe01e
      ARTIFACT_ROOT: artifacts/homeostasis-v2-three-arm-replacement
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce fresh one-shot paid boundary
        run: |
          set -eu
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_NAME" = "agent/homeostasis-v2-three-arm-replacement-launch"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test -n "$ANTHROPIC_API_KEY"
          test -f "$AUTHORIZATION_FILE"
          test "$(wc -l < "$AUTHORIZATION_FILE")" -eq 1
          test "$(grep -Fxc "$EXPECTED_CONFIRMATION" "$AUTHORIZATION_FILE")" -eq 1
          grep -Fxq "$ORIGINAL_CONFIRMATION" experiments/sandbox/HOMEOSTASIS_V2_EXECUTION_GATE.md
          git merge-base --is-ancestor "$EXPECTED_REPAIR_MERGE" HEAD
          git fetch --no-tags origin agent/audited-memory-v1:refs/remotes/origin/agent/audited-memory-v1
          test "$(git rev-list --count origin/agent/audited-memory-v1..HEAD)" -eq 1
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l)" -eq 1
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$AUTHORIZATION_FILE"

      - name: Run unpaid verification
        run: |
          set -eu
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m py_compile capage/*.py tests/*.py
          python -m capage.homeostasis_v2_active_runner experiments/sandbox/economic_homeostasis_v2_prereg_v1.json --checkpoint /tmp/homeostasis-v2-validation-checkpoint.json --artifact-dir /tmp/homeostasis-v2-validation-cells --validate-only

      - name: Verify replacement debit and record provenance
        run: |
          set -eu
          mkdir -p "$ARTIFACT_ROOT/cells"
          python - <<'PY' > "$ARTIFACT_ROOT/authorization-and-budget.json"
          import json
          from pathlib import Path

          from capage.homeostasis_v2_active_runner import (
              ABORTED_RUN_COST_REFERENCE,
              ABORTED_RUN_MODEL_COST_UNITS,
              ActiveConfig,
          )

          plan = json.loads(Path(
              "experiments/sandbox/economic_homeostasis_v2_prereg_v1.json"
          ).read_text(encoding="utf-8"))
          config = ActiveConfig.from_plan(plan)
          ceiling = config.aggregate_cost_cap_cents * 1_000_000
          remaining = ceiling - ABORTED_RUN_MODEL_COST_UNITS
          assert ABORTED_RUN_MODEL_COST_UNITS == 28_915_600
          assert ABORTED_RUN_COST_REFERENCE == (
              "github-actions-run:32292164227/artifact:9379919939"
          )
          assert ceiling == 1_350_000_000
          assert remaining == 1_321_084_400
          print(json.dumps({
              "aborted_run_cost_reference": ABORTED_RUN_COST_REFERENCE,
              "authorization_file": (
                  "experiments/sandbox/"
                  "HOMEOSTASIS_V2_REPLACEMENT_AUTHORIZATION.md"
              ),
              "prior_model_cost_units": ABORTED_RUN_MODEL_COST_UNITS,
              "remaining_model_cost_units": remaining,
              "total_model_cost_ceiling_units": ceiling,
          }, sort_keys=True))
          PY
          git rev-parse HEAD > "$ARTIFACT_ROOT/execution-commit.txt"
          sha256sum experiments/sandbox/economic_homeostasis_v2_prereg_v1.json experiments/sandbox/HOMEOSTASIS_V2_EXECUTION_GATE.md experiments/sandbox/HOMEOSTASIS_V2_REPLACEMENT_LAUNCH.md experiments/sandbox/HOMEOSTASIS_V2_REPLACEMENT_AUTHORIZATION.md experiments/sandbox/HOMEOSTASIS_V2_ABORTED_RUN_32292164227.md .github/workflows/homeostasis-v2-three-arm-replacement-launch.yml capage/sandbox.py capage/sandbox_runner.py capage/homeostasis.py capage/homeostasis_shadow.py capage/homeostasis_experiment.py capage/homeostasis_v2.py capage/homeostasis_v2_runner.py capage/homeostasis_v2_experiment.py capage/homeostasis_v2_active_runner.py > "$ARTIFACT_ROOT/execution-sha256.txt"

      - name: Execute all eighteen bounded matched cells
        run: |
          set -eu
          python -m capage.homeostasis_v2_active_runner experiments/sandbox/economic_homeostasis_v2_prereg_v1.json --checkpoint "$ARTIFACT_ROOT/checkpoint.json" --artifact-dir "$ARTIFACT_ROOT/cells" --max-cells 18 --confirm "$ORIGINAL_CONFIRMATION"

      - name: Upload restricted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homeostasis-v2-three-arm-replacement-launch-restricted
          path: artifacts/homeostasis-v2-three-arm-replacement/
          if-no-files-found: warn
          retention-days: 30
